<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Contact</title>
</head>

<body onload="getContact()">

    <h2>Contact Details</h2>

    <div id="avatarImage"></div>

    
    <form id="editForm">

        <label>Firstname</label><br>
        <input type="text" name="firstname" id="firstname" readonly><br><br>

        <label>Lastname</label><br>
        <input type="text" name="lastname" id="lastname" readonly><br><br>

        <label>Mobile</label><br>
        <input type="text" name="mobile" id="mobile" readonly><br><br>

        <label>Email</label><br>
        <input type="email" name="email" id="email" readonly><br><br>

        <label id="avatarLabel" hidden>Select Avatar</label><br>
        <input type="file" id="avatar" name="avatar" hidden><br><br>

        <button type="submit" id="submitForm" hidden>Save</button>

    </form>

    <br>

    <button type="button" id="homeLink">Home</button>
    <button type="button" id="editContact">Edit</button>
    <button type="button" id="deleteContact">Delete</button>

    <script src="config.js"></script>

    <script>
        var id = getId();
        var currentAvatar = "";

        document.getElementById("homeLink").addEventListener('click', homeLink);
        document.getElementById("editContact").addEventListener('click', editContact);
        document.getElementById("deleteContact").addEventListener('click', deleteContact);
        document.getElementById("editForm").addEventListener('submit', submitForm);

        console.log(id);

        function getId(){
            return new URLSearchParams(window.location.search).get('id');
        }

        function getContact(){
            fetch(rootPath + 'controller/get-contacts/?id=' + id)
            .then(function(response){
                return response.json();
            })
            .then(function(data){
                displayOutput(data);
                console.log(data);
            })
        }

        function homeLink(){
            window.open("index.html", "_self");
        }

        function displayOutput(data){
            currentAvatar = data[0].avatar;
            var avatarImg = `<img src="${rootPath}/controller/uploads/${currentAvatar}" width="200" />`;

            document.getElementById("avatarImage").innerHTML = avatarImg;
            document.getElementById("firstname").value = data[0].firstname;
            document.getElementById("lastname").value = data[0].lastname;
            document.getElementById("mobile").value = data[0].mobile;
            document.getElementById("email").value = data[0].email;
        }

        function editContact(){
            document.getElementById("firstname").readOnly = false;
            document.getElementById("lastname").readOnly = false;
            document.getElementById("mobile").readOnly = false;
            document.getElementById("email").readOnly = false;

            document.getElementById("avatarLabel").hidden = false;
            document.getElementById("avatar").hidden = false;
            document.getElementById("submitForm").hidden = false;
        }

        
        function deleteContact(){
            if (!confirm("Are you sure you want to delete this contact?")) {
                return;
            }

            fetch(rootPath + "controller/delete-contact/?id=" + id)
            .then(function(response){
                return response.text();
            })
            .then(function(data){
                if (data.trim() == "1") {
                    alert("Contact deleted");
                    homeLink();
                } else {
                    alert(data);
                }
            })
            .catch(function(error){
                console.error(error);
                alert("Could not delete contact.");
            });
        }

        function submitForm(e){
            e.preventDefault();

            const form = new FormData(document.querySelector("#editForm"));
            form.append('apiKey', apiKey);
            form.append('id', id);

            
            if (!document.getElementById("avatar").files.length) {
                form.append('currentAvatar', currentAvatar);
            }

            fetch(rootPath + "controller/edit-contact/", {
                method: "POST",
                headers: {"Accept": "application/json"},
                body: form
            })
            .then(function(response){
                return response.text();
            })
            .then(function(data){
                if (data == "1") {
                    alert("Contact edited");
                    homeLink();
                } else {
                    alert(data);
                    homeLink();
                }
            });
        }
    </script>

</body>
</html>
